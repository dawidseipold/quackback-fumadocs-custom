name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * *'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://postgres:password@localhost:5432/quackback_test
  BETTER_AUTH_SECRET: test-secret-for-ci-only-must-be-at-least-32-characters
  BASE_URL: http://localhost:3000

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Audit production dependencies
        run: bun scripts/audit-check.ts
      - run: bun run lint
      # Build the widget bundle first — apps/web imports
      # packages/widget/dist/browser.js via Vite ?raw, so it must exist
      # before the web build runs.
      - run: bun run --filter @quackback/widget build
      - run: bun run build
        env:
          SKIP_ENV_VALIDATION: true
      # A server function the client graph never references is left out of the
      # generated manifest, so calling it 500s at request time and only in a
      # production build. Compare the built bundle's call sites against the
      # manifest while we still have the output.
      - run: bun run --cwd apps/web check:server-fn-manifest
      # crazy-hub: Quackback's page routes are out of the build (src/app/routes.ts), so the full
      # typecheck of its old UI no longer applies; the new app and everything it imports (server
      # routes, server functions, lib) is checked instead. The route tree and the Paraglide output it
      # needs were generated by the build above.
      - run: bun run --cwd apps/web typecheck:app
      - run: bun run --cwd packages/widget typecheck
      - run: bun run --cwd packages/widget test
      - run: bun run --cwd packages/db typecheck
      - run: bunx tsc --noEmit -p packages/email/tsconfig.json

  # Four shards on four-core runners. The ~1,300-file suite was ~8–9 min of
  # wall clock on one job; splitting files is what makes the unit gate finish
  # in a couple of minutes.

  unit:
    name: test (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: quackback_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      # Renderer tests use jsdom with DOMPurify, which requires a current Node runtime.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run db:migrate
      # crazy-hub: the new app's tests import the compiled Paraglide messages
      - run: bun run --cwd apps/web i18n:compile
      # Drift only needs to run once; shard 1 owns it so the other three start
      # the suite immediately after migrate.
      - name: Check migration/schema drift
        if: matrix.shard == 1
        run: bun run db:check-drift
      - run: bun run test --run --shard=${{ matrix.shard }}/4 --reporter=dot --reporter=github-actions

  # Single check name so existing "test" required-status wiring still matches.

  test:
    needs: unit
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All unit shards passed
        run: test "${{ needs.unit.result }}" = "success"

  live-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: quackback_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      CI: 'true'
      SECRET_KEY: live-api-secret-key-for-ci-only-at-least-32-characters
      BASE_URL: http://acme.localhost:3000
      API_BASE_URL: http://acme.localhost:3000/api/v1
      REQUIRE_LIVE_API: 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Map workspace hostname to loopback
        run: echo "127.0.0.1 acme.localhost" | sudo tee -a /etc/hosts
      - run: bun install --frozen-lockfile
      - run: bun run --filter @quackback/widget build
      - run: bun run db:migrate
      - run: bun run db:seed
      - name: Write runtime environment
        run: |
          cat > .env <<EOF
          DATABASE_URL=$DATABASE_URL
          SECRET_KEY=$SECRET_KEY
          BASE_URL=$BASE_URL
          EOF
      # crazy-hub: the server entry imports the compiled Paraglide runtime, and `vite dev` would race the
      # plugin's first compile on a fresh checkout
      - run: bun run --cwd apps/web i18n:compile
      - name: Provision CI API key
        run: |
          api_key=$(bun apps/web/scripts/create-ci-api-key.ts)
          echo "::add-mask::$api_key"
          echo "API_KEY=$api_key" >> "$GITHUB_ENV"
      - name: Start application and run live API assertions
        run: |
          # Bind every interface. Vite's default localhost is sometimes
          # IPv6-only while Node fetch of *.localhost uses 127.0.0.1.
          bun --env-file=.env --cwd apps/web vite dev --host 0.0.0.0 --port 3000 \
            > /tmp/quackback-live-api.log 2>&1 &
          ready=0
          for attempt in $(seq 1 90); do
            if curl --fail --silent "$BASE_URL/api/health/ready" > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo '===== server log (never became ready) ====='
            cat /tmp/quackback-live-api.log
            exit 1
          fi
          if ! (cd apps/web && bunx vitest run --config vitest.config.ts \
            src/lib/server/domains/api/__tests__/api-integration.test.ts); then
            echo '===== server log (vitest failed) ====='
            cat /tmp/quackback-live-api.log
            ss -lntp || true
            exit 1
          fi

  # crazy-hub: end-to-end tests of the new UI (apps/web/e2e-app) against a dev server with the demo seed
  e2e-app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: quackback_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      CI: 'true'
      SECRET_KEY: e2e-app-secret-key-for-ci-only-at-least-32-characters
      BASE_URL: http://localhost:3000
      PLAYWRIGHT_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run --filter @quackback/widget build
      - run: bun run --cwd apps/web i18n:compile
      - run: bun run db:migrate
      - run: bun run db:seed
      - name: Write runtime environment
        run: |
          cat > .env <<EOF
          DATABASE_URL=$DATABASE_URL
          SECRET_KEY=$SECRET_KEY
          BASE_URL=$BASE_URL
          EOF
      - name: Install Playwright Chromium
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium
      - name: Start the app and run the e2e tests
        run: |
          bun --env-file=.env --cwd apps/web vite dev --host 0.0.0.0 --port 3000 > /tmp/app.log 2>&1 &
          for attempt in $(seq 1 90); do
            curl --fail --silent "$BASE_URL/api/health/ready" > /dev/null && break
            sleep 1
          done
          if ! (cd apps/web && bunx playwright test -c playwright.app.config.ts); then
            echo '===== server log ====='
            tail -200 /tmp/app.log
            exit 1
          fi
